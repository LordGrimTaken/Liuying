name: Desktop (macOS)

# macOS bundles cannot be built on Windows, so they are built here on a macOS runner
# and attached to the matching desktop-v* release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Build dmg and zip (x64 + arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: List output
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: liuying-desktop-macos
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: gh release upload "${GITHUB_REF_NAME}" desktop/dist/*.dmg desktop/dist/*.zip --clobber

